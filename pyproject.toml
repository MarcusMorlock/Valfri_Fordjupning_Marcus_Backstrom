[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor_pipeline"
version = "0.1.0"
description = "Sensor data validation pipeline"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]